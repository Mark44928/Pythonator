[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pythonator"
version = "0.5.0"
description = "A dependency-free Python calculator REPL and --eval tool in the spirit of Plusalator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mark44928" }]
keywords = ["calculator", "cli", "repl", "termux"]

[project.scripts]
pythonator = "pythonator.__main__:main"

[tool.setuptools.packages.find]
include = ["pythonator*"]
